---
name: Deploy Backend to DigitalOcean App Platform

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.do/app.yaml'
      - '.github/workflows/deploy-backend-app-platform.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Create env.yaml from secrets
        run: |
          cat > .do/env.yaml << EOF
          envs:
            - key: PORT
              value: "${{ secrets.PORT || '3001' }}"
            - key: NODE_ENV
              value: "${{ secrets.NODE_ENV || 'production' }}"
            - key: MONGODB_URI
              scope: RUN_AND_BUILD_TIME
              type: SECRET
              value: "${{ secrets.MONGODB_URI }}"
            - key: ALLOWED_ORIGINS
              value: "${{ secrets.ALLOWED_ORIGINS }}"
          EOF
          echo "Environment file created"

      - name: Merge environment variables
        run: |
          # Install yq for YAML processing
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          
          # Merge env.yaml into app.yaml
          yq eval-all 'select(fileIndex == 0).services[0].envs = select(fileIndex == 1).envs | select(fileIndex == 0)' \
            .do/app.yaml .do/env.yaml > /tmp/app-final.yaml
          
          echo "Merged app spec:"
          cat /tmp/app-final.yaml

      - name: Deploy to App Platform
        run: |
          # Check if app exists
          APP_ID=$(doctl apps list --format ID,Spec.Name \
            --no-header | grep "admin-panel-backend" | awk '{print $1}' || echo "")

          if [ -z "$APP_ID" ]; then
            echo "Creating new app..."
            doctl apps create --spec /tmp/app-final.yaml
          else
            echo "Updating existing app (ID: $APP_ID)..."
            doctl apps update $APP_ID --spec /tmp/app-final.yaml
          fi

      - name: Wait for deployment
        run: |
          echo "Deployment initiated."
          echo "Check status at https://cloud.digitalocean.com/apps"
          echo "Use 'doctl apps list' to see your apps"
