name: admin-panel-backend
region: sgp1

services:
  - name: backend
    source_dir: backend
    github:
      repo: somkheartk/admin-panel-material
      branch: main
      deploy_on_push: true
    
    # Build configuration
    build_command: npm install && npm run build
    
    # Run configuration
    run_command: npm start
    
    # Environment
    environment_slug: node-js
    
    # Instance configuration
    instance_count: 1
    instance_size_slug: basic-xxs
    
    # HTTP configuration
    http_port: 3001
    
    # Health check
    health_check:
      http_path: /health
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    
    # Environment variables
    envs:
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        scope: RUN_AND_BUILD_TIME
        type: SECRET
    
    # Routes
    routes:
      - path: /
